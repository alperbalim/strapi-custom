version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: affiliate-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - affiliate-network
    expose:
      - "5432"

  strapi:
    build:
      context: ./apps/cms
      dockerfile: Dockerfile
    container_name: affiliate-strapi
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      APP_KEYS: ${APP_KEYS}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./apps/cms/public/uploads:/opt/app/public/uploads
    expose:
      - "1337"
    networks:
      - affiliate-network
    depends_on:
      - postgres

  nextjs:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: affiliate-nextjs
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    expose:
      - "3000"
    networks:
      - affiliate-network
    depends_on:
      - strapi

networks:
  affiliate-network:
    driver: bridge

volumes:
  postgres-data:
